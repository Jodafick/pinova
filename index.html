<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Thème avant le 1er paint : aligné sur `useAppearance` (localStorage `pinova-appearance`).
      Sans cela, un utilisateur en « dark » avec OS clair voyait un flash / splash trop clair.
    -->
    <script>
      (function () {
        try {
          var p = (location.pathname || '/').replace(/\/$/, '') || '/'
          if (
            p === '/create' ||
            p.indexOf('/create/') === 0 ||
            p === '/story/create' ||
            /^\/pin\/[^/]+\/edit$/.test(p)
          ) {
            sessionStorage.setItem('pinova-skip-splash', '1')
          }
        } catch (_) {
          /* ignore */
        }
      })()
    </script>
    <script>
      (function () {
        try {
          var key = 'pinova-appearance'
          var stored = localStorage.getItem(key)
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (_) {
          /* ignore */
        }
      })()
    </script>
    <!--
      viewport-fit=cover : safe areas iOS (Dynamic Island, Home Indicator).
      interactive-widget=resizes-content : iOS 17+ — le clavier ne redimensionne
      plus le layout brutalement, on gère via visualViewport.
      minimum-scale / maximum-scale : empêche pinch-zoom natif (PWA premium iOS).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Pinova — votre source d'inspiration visuelle." />
    <meta name="format-detection" content="telephone=no" />

    <title>Pinova</title>

    <!--
      theme-color : différent en light vs dark (iOS 15+ supporte media queries).
      Initial : blanc pour éviter flash sombre au premier paint sur iOS Safari.
      Le composable usePwaTheme prend ensuite le relais dynamiquement.
    -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Installation PWA / écran d’accueil (iOS & Android) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pinova" />
    <!--
      black-translucent : la status bar overlap le contenu (PWA premium).
      Combiné à env(safe-area-inset-top) → contenu sous Dynamic Island.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#e0245e" />

    <!-- Favicon HD pour onglets desktop. -->
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />

    <!--
      Splash screens iOS (générés via PWA Builder ou similaire).
      NOTE : iOS ne supporte qu'un seul splash via apple-touch-startup-image.
      Si tu génères les variantes (iPhone 14 Pro / iPhone SE / iPad / etc.), pose-les ici.
      En attendant, le PwaSplash.vue couvre le boot une fois le HTML rendu.
    -->
    <link rel="apple-touch-startup-image" href="/logo.png" />

    <!--
      DNS prefetch / preconnect pour réduire la latence du premier paint en
      mode standalone (iOS Safari ne supporte pas les Resource Hints aussi
      activement que Chrome mais ça aide quand même).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- API + médias (Render) — réduit TTFB sur le premier fetch feed / images. -->
    <link rel="preconnect" href="https://pinova-backend-8mlq.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://pinova-backend-8mlq.onrender.com" />

    <link rel="preload" as="image" href="/logo.png" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300..500;1,9..40,300&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300..500;1,9..40,300&display=swap"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      />
    </noscript>

    <!--
      Anti flash blanc au boot : on pose le background dès le HTML (avant CSS).
      `usePwaTheme` synchronise ensuite avec le mode dark/light de l'utilisateur.
    -->
    <style>
      :root { color-scheme: light dark; }
      html,
      body {
        background-color: #faf7f9;
      }
      html.dark,
      html.dark body {
        background-color: #050506;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        /* iOS rubber band scrolling : on contraint au document root. */
        overscroll-behavior-y: none;
        /* Empêche le tap-highlight bleu Safari sur le body. */
        -webkit-tap-highlight-color: transparent;
        /* Désactive le callout iOS sur long-press image global (on autorise localement). */
        -webkit-touch-callout: none;
        /* Évite le décalage du body lié à la safe-area top en standalone. */
        padding: 0;
      }
      /* En standalone, on désactive le user-select au niveau global pour un feel natif.
         Les composants qui ont besoin de sélection (input, textarea, contenteditable) le réactivent. */
      @media all and (display-mode: standalone) {
        body { -webkit-user-select: none; user-select: none; }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
      }
      #app {
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
      }

      /* Splash instantané avant le bundle JS (mobile PWA : plus d'écran vide). */
      #pinova-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 30% 25%, rgba(255, 145, 180, 0.88) 0%, transparent 52%),
          linear-gradient(145deg, #d01f56 0%, #e0245e 22%, #ff4d7d 48%, #ff9ab8 100%);
        transition: opacity 280ms ease;
      }
      html.dark #pinova-boot-splash {
        background:
          radial-gradient(circle at 78% 82%, rgba(60, 8, 28, 0.18) 0%, transparent 55%),
          #050507;
      }
      #pinova-boot-splash img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      }
    </style>
  </head>
  <body>
    <div id="pinova-boot-splash" aria-hidden="true">
      <img src="/logo.png" alt="" width="72" height="72" decoding="async" fetchpriority="high" />
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
